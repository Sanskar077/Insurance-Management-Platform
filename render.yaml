# Render Blueprint — deploys the full stack in one click ("New +" → "Blueprint").
# Docs: https://render.com/docs/blueprint-spec
#
# You will be prompted for the two cross-service URLs at creation time
# (each service needs the other's public URL, which doesn't exist until
# the first deploy — enter placeholders first, then update after both
# services are live and trigger one redeploy):
#   CLIENT_ORIGIN      → https://<your-frontend>.onrender.com
#   VITE_API_BASE_URL  → https://<your-backend>.onrender.com/api

databases:
  - name: insurance-db
    plan: free
    databaseName: insurance_db
    user: insurance

services:
  # ---- Backend API (Docker) ------------------------------------------------
  - type: web
    name: insurance-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: insurance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random secret
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_ORIGIN
        sync: false # prompted — set to the frontend's public URL
    # NOTE (free plan): the filesystem is ephemeral — uploaded documents are
    # lost on redeploy. Attach a paid persistent disk mounted at /app/uploads
    # to keep them:
    # disk:
    #   name: uploads
    #   mountPath: /app/uploads
    #   sizeGB: 1

  # ---- Frontend (static site) ----------------------------------------------
  - type: web
    name: insurance-frontend
    runtime: static
    rootDir: frontend
    buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # prompted — set to the backend's public URL + /api
    routes:
      # SPA fallback — client-side routes resolve to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
